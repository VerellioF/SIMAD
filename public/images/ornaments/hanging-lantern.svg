<svg xmlns="http://www.w3.org/2000/svg" width="90" height="220" viewBox="0 0 90 220" fill="none">
  <defs>
    <radialGradient id="lanternGlow" cx="50%" cy="55%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brassGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="30%" stop-color="#d4af37"/>
      <stop offset="70%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
  </defs>

  <!-- Hanging Chain -->
  <line x1="45" y1="0" x2="45" y2="50" stroke="#d4af37" stroke-width="2" stroke-dasharray="3,3"/>
  
  <!-- Chain Ring -->
  <circle cx="45" cy="53" r="5" stroke="url(#brassGrad)" stroke-width="2.5" fill="none"/>
  
  <!-- Lantern Top Cap / Dome -->
  <path d="M30 65 C30 55 60 55 60 65 L65 72 H25 L30 65 Z" fill="url(#brassGrad)"/>
  <circle cx="45" cy="59" r="2.5" fill="#fef08a"/>

  <!-- Ornate Canopy -->
  <path d="M20 72 H70 L75 85 H15 L20 72 Z" fill="url(#brassGrad)"/>
  <!-- Scallops on canopy -->
  <circle cx="25" cy="85" r="3" fill="#78350f"/>
  <circle cx="35" cy="85" r="3" fill="#78350f"/>
  <circle cx="45" cy="85" r="3" fill="#78350f"/>
  <circle cx="55" cy="85" r="3" fill="#78350f"/>
  <circle cx="65" cy="85" r="3" fill="#78350f"/>

  <!-- Light Glow Behind Glass -->
  <circle cx="45" cy="120" r="38" fill="url(#lanternGlow)"/>

  <!-- Lantern Glass Body (Hexagonal / Tapered) -->
  <polygon points="22,86 68,86 78,145 12,145" fill="#fef3c7" fill-opacity="0.25" stroke="url(#brassGrad)" stroke-width="1.5"/>

  <!-- Inner Candle / Glow Flame -->
  <ellipse cx="45" cy="122" rx="6" ry="12" fill="#fffbeb"/>
  <ellipse cx="45" cy="122" rx="3.5" ry="8" fill="#f59e0b"/>

  <!-- Vertical Lattice Ribs -->
  <line x1="36" y1="86" x2="32" y2="145" stroke="url(#brassGrad)" stroke-width="2"/>
  <line x1="54" y1="86" x2="58" y2="145" stroke="url(#brassGrad)" stroke-width="2"/>
  
  <!-- Geometric Arch Windows inside Glass -->
  <path d="M36 100 C36 92 54 92 54 100 V135 H36 Z" fill="none" stroke="#d4af37" stroke-width="1.2" stroke-opacity="0.8"/>

  <!-- Lantern Bottom Base -->
  <path d="M12 145 H78 L68 165 H22 L12 145 Z" fill="url(#brassGrad)"/>
  <path d="M28 165 H62 L55 178 H35 L28 165 Z" fill="url(#brassGrad)"/>

  <!-- Bottom Finial / Pendant -->
  <path d="M45 178 L48 190 L45 200 L42 190 Z" fill="url(#brassGrad)"/>
  <circle cx="45" cy="204" r="3.5" fill="#d4af37"/>
</svg>
