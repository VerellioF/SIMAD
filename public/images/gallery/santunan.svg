<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="sanBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4C1D95"/>
      <stop offset="50%" stop-color="#0D3B2E"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>
    <linearGradient id="goldSan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#sanBg)"/>
  <!-- Islamic Crescent & Giving Hands -->
  <g transform="translate(400, 200)">
    <circle cx="0" cy="0" r="100" fill="url(#goldSan)" opacity="0.15"/>
    <!-- Crescent -->
    <path d="M25,-60 A65,65 0 1,1 -40,5 A75,75 0 1,0 25,-60 Z" fill="url(#goldSan)"/>
    <!-- Heart / Giving Symbol -->
    <path d="M0,10 C-30,-20 -50,15 0,55 C50,15 30,-20 0,10 Z" fill="#F43F5E" stroke="#FFE4E6" stroke-width="2"/>
  </g>
  <rect x="0" y="380" width="800" height="120" fill="#051C15" opacity="0.9"/>
  <text x="40" y="425" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800" fill="#FAF8F5">Peringatan 10 Muharram &amp; Santunan Yatim</text>
  <text x="40" y="455" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="500" fill="#D4AF37">Menumbuhkan kepedulian sosial, keikhlasan dan kecintaan pada sesama</text>
</svg>
