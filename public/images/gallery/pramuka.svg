<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="praBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14532D"/>
      <stop offset="50%" stop-color="#1E3A1E"/>
      <stop offset="100%" stop-color="#0F291E"/>
    </linearGradient>
    <linearGradient id="praGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#praBg)"/>
  <!-- Camp Tent & Pine Trees -->
  <g fill="#166534" opacity="0.6">
    <polygon points="120,320 160,200 200,320"/>
    <polygon points="180,330 220,180 260,330"/>
    <polygon points="600,330 640,180 680,330"/>
    <polygon points="660,320 700,200 740,320"/>
  </g>
  <!-- Camp Tent in Foreground -->
  <g transform="translate(400, 240)">
    <polygon points="0,-100 120,80 -120,80" fill="#854D0E" stroke="url(#praGold)" stroke-width="3"/>
    <polygon points="0,-100 0,80 -120,80" fill="#713F12"/>
    <polygon points="0,-100 30,80 -30,80" fill="#1C1917" opacity="0.6"/>
    <!-- Flagpole with Indonesian Flag -->
    <line x1="160" y1="-120" x2="160" y2="80" stroke="#FAF8F5" stroke-width="4"/>
    <rect x="160" y="-120" width="45" height="15" fill="#DC2626"/>
    <rect x="160" y="-105" width="45" height="15" fill="#FFFFFF"/>
  </g>
  <rect x="0" y="380" width="800" height="120" fill="#051C15" opacity="0.9"/>
  <text x="40" y="425" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800" fill="#FAF8F5">Perkemahan Pramuka Madrasah (Persami)</text>
  <text x="40" y="455" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="500" fill="#D4AF37">Pendidikan karakter mandiri, cinta alam, kedisiplinan dan kepemimpinan</text>
</svg>
