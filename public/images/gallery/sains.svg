<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="sciBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E3746"/>
      <stop offset="50%" stop-color="#0D3B2E"/>
      <stop offset="100%" stop-color="#08251C"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#sciBg)"/>
  <!-- Beaker & Atom Graphic -->
  <g transform="translate(400, 200)">
    <!-- Atom Rings -->
    <ellipse cx="0" cy="0" rx="140" ry="50" fill="none" stroke="#38BDF8" stroke-width="2" opacity="0.4" transform="rotate(30)"/>
    <ellipse cx="0" cy="0" rx="140" ry="50" fill="none" stroke="#34D399" stroke-width="2" opacity="0.4" transform="rotate(-30)"/>
    <ellipse cx="0" cy="0" rx="140" ry="50" fill="none" stroke="#FBBF24" stroke-width="2" opacity="0.4" transform="rotate(90)"/>
    <circle cx="0" cy="0" r="16" fill="#38BDF8"/>
    <!-- Flask Beaker -->
    <path d="M-20,-50 L-20,-10 L-65,70 C-75,85 -60,95 -45,95 L45,95 C60,95 75,85 65,70 L20,-10 L20,-50 Z" fill="#0284C7" fill-opacity="0.3" stroke="#BAE6FD" stroke-width="3"/>
    <path d="M-50,60 C-20,45 20,70 50,60 L45,95 L-45,95 Z" fill="#10B981" fill-opacity="0.7"/>
  </g>
  <rect x="0" y="380" width="800" height="120" fill="#051C15" opacity="0.9"/>
  <text x="40" y="425" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800" fill="#FAF8F5">Praktikum Sains &amp; Literasi Digital Madrasah</text>
  <text x="40" y="455" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="500" fill="#D4AF37">Pembelajaran saintifik berbasis eksperimen, logika dan teknologi ramah anak</text>
</svg>
