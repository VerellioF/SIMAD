<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08251C"/>
      <stop offset="50%" stop-color="#0D3B2E"/>
      <stop offset="100%" stop-color="#1B4D3E"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E08F"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <circle cx="400" cy="220" r="140" fill="#D4AF37" opacity="0.12"/>
  <!-- Islamic Arch Decoration -->
  <path d="M250,500 L250,220 C250,120 400,60 400,60 C400,60 550,120 550,220 L550,500" fill="none" stroke="url(#gold)" stroke-width="2.5" opacity="0.4"/>
  <!-- Rehal & Quran -->
  <g transform="translate(400, 260) scale(1.6) translate(-50, -50)">
    <path d="M20,65 L50,45 L80,65" stroke="#92400E" stroke-width="8" stroke-linecap="round"/>
    <path d="M15,65 L30,85 M85,65 L70,85" stroke="#92400E" stroke-width="8" stroke-linecap="round"/>
    <path d="M50,40 C30,25 10,28 -5,32 L-5,5 C10,0 30,0 50,15 Z" fill="#FAF8F5" stroke="url(#gold)" stroke-width="2"/>
    <path d="M50,40 C70,25 90,28 105,32 L105,5 C90,0 70,0 50,15 Z" fill="#FAF8F5" stroke="url(#gold)" stroke-width="2"/>
  </g>
  <!-- Text Label -->
  <rect x="0" y="380" width="800" height="120" fill="#051C15" opacity="0.9"/>
  <text x="40" y="425" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800" fill="#FAF8F5">Ujian Munaqasyah &amp; Wisuda Tahfidz Juz 30</text>
  <text x="40" y="455" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="500" fill="#D4AF37">Evaluasi tartil dan fashohah santri oleh Tim Asatidz Huffadz</text>
</svg>
