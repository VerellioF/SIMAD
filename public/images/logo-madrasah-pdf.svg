<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background Circle & Gold Border -->
  <circle cx="100" cy="100" r="95" fill="#0D3B2E" stroke="#D4AF37" stroke-width="4"/>
  
  <!-- Outer Decorative Ring -->
  <circle cx="100" cy="100" r="88" fill="none" stroke="#D4AF37" stroke-width="1.2" stroke-dasharray="4,3" opacity="0.8"/>
  <circle cx="100" cy="100" r="82" fill="none" stroke="#D4AF37" stroke-width="1"/>

  <!-- 8-Pointed Star (Rub el Hizb) -->
  <g transform="translate(100, 100) scale(0.68) translate(-100, -100)" fill="none" stroke="#D4AF37" stroke-width="2.5">
    <rect x="35" y="35" width="130" height="130" rx="12" />
    <rect x="35" y="35" width="130" height="130" rx="12" transform="rotate(45 100 100)" />
  </g>

  <!-- Islamic Dome / Arch Silhouette Center -->
  <path d="M70,128 C70,95 85,82 100,68 C115,82 130,95 130,128 Z" fill="#08251C" stroke="#D4AF37" stroke-width="1.5" />
  
  <!-- Radiant Rays -->
  <g stroke="#D4AF37" stroke-width="1.2" opacity="0.7">
    <line x1="100" y1="65" x2="100" y2="48" />
    <line x1="88" y1="68" x2="76" y2="54" />
    <line x1="112" y1="68" x2="124" y2="54" />
    <line x1="80" y1="78" x2="65" y2="68" />
    <line x1="120" y1="78" x2="135" y2="68" />
  </g>

  <!-- Crescent & Star on Dome Peak -->
  <path d="M99,44 A5,5 0 1,1 96,51 A6.5,6.5 0 1,0 99,44 Z" fill="#D4AF37" />
  <polygon points="102,46 103,48 105,48 103.5,49.5 104,51.5 102,50 100,51.5 100.5,49.5 99,48 101,48" fill="#D4AF37" transform="scale(0.8) translate(26, 11)"/>

  <!-- Open Quran Book -->
  <g fill="none" stroke="#D4AF37" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left Page -->
    <path d="M100,125 C88,114 74,115 62,118 L62,138 C74,135 88,134 100,145 Z" fill="#FAF8F5" />
    <!-- Right Page -->
    <path d="M100,125 C112,114 126,115 138,118 L138,138 C126,135 112,134 100,145 Z" fill="#FAF8F5" />
    <!-- Center Spine & Bookmark Ribbon -->
    <line x1="100" y1="124" x2="100" y2="148" stroke="#D4AF37" stroke-width="3" />
    <path d="M100,148 L97,156 L100,154 L103,156 Z" fill="#D4AF37" stroke="none" />
  </g>
</svg>